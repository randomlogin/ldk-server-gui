<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chain Source</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="/common.js"></script>
<style>
:root {
  --bg: #0b0e14;
  --panel: #12161f;
  --panel2: #171d29;
  --border: #232b3a;
  --text: #d7dde8;
  --muted: #8a93a5;
  --accent: #f7931a;
  --green: #3fb96b;
  --red: #e5534b;
  --blue: #58a6ff;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 10px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
a { color: var(--blue); }
.muted { color: var(--muted); }
.mono { font-family: ui-monospace, monospace; font-size: 12px; }
header {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 18px; margin-bottom: 14px;
}
.badge {
  display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px;
  border: 1px solid var(--border); background: var(--panel2); color: var(--muted);
}
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
.dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot.err { background: var(--red); box-shadow: 0 0 6px var(--red); }
.grid { display: grid; gap: 14px; }
.cards { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.card, .panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
}
.card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.card .value { font-size: 22px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
.card .value.small { font-size: 15px; font-weight: 600; margin-top: 8px; }
.card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.ok { color: var(--green); }
.err { color: var(--red); }
.panel { overflow-x: auto; margin-top: 14px; }
.kv { display: grid; grid-template-columns: 180px 1fr; gap: 4px 12px; font-size: 13px; }
.kv div:nth-child(odd) { color: var(--muted); }
.banner { display: none; background: rgba(229,83,75,.12); border: 1px solid #6b2a26; color: var(--red); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
.banner.show { display: block; }
button.copy { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 11px; padding: 0 4px; }
button.copy:hover { color: var(--accent); }
.topnav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.topnav a {
  padding: 6px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel);
  color: var(--muted); text-decoration: none;
}
.topnav a.current { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>⛓️ Chain Source <span id="kindbadge" class="badge">…</span></h1>
  <div>
    <span class="badge"><span id="conndot" class="dot err"></span><span id="connlabel">connecting…</span></span>
    <span class="badge" title="Last refresh"><span id="updated" class="muted">never</span></span>
  </div>
</header>
<nav class="topnav">
  <a href="/">LDK node</a>
  <a href="/kyoto">Kyoto</a>
  <a href="/chain" class="current">Chain</a>
  <a href="/resources">Resources</a>
  <!--CONTROL_LINK-->
</nav>

<p class="muted" style="max-width:720px">
  How the node's source of blockchain data is doing. The GUI probes the source itself — the node only
  reports chain source activity for compact block filters, and those counters are on the
  <a href="/kyoto">Kyoto page</a>.
</p>

<div id="banner" class="banner"></div>
<div class="grid cards" id="cards"></div>

<div class="panel">
  <h2>Details</h2>
  <div class="kv" id="details"></div>
</div>

<script>
const $ = id => document.getElementById(id);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = h => h && h.length > 24 ? h.slice(0, 10) + "…" + h.slice(-6) : (h || "—");
const idSpan = (h, cls) => h
  ? `<span class="${cls || "mono"}" title="${esc(h)}">${esc(short(h))}</span>${copyBtn(h)}`
  : "—";

function card(label, value, sub, small) {
  return `<div class="card"><div class="label">${label}</div>` +
    `<div class="value${small ? " small" : ""}">${value}</div>` +
    `<div class="sub">${sub || "&nbsp;"}</div></div>`;
}

function ago(ts) {
  if (!ts) return "unknown";
  const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

function setConn(ok, label) {
  $("conndot").className = "dot " + (ok ? "ok" : "err");
  $("connlabel").textContent = label;
}

function render(d) {
  const probe = d.probe || {};
  const node = d.node || {};
  const ok = !!probe.ok;
  const data = ok ? (probe.data || {}) : {};
  setConn(ok, ok ? "source reachable" : "source unreachable");
  $("updated").textContent = d.fetched_at
    ? new Date(d.fetched_at * 1000).toLocaleTimeString() : "never";
  $("kindbadge").textContent = d.kind || "unknown";

  const banner = $("banner");
  if (ok || !probe.error) banner.classList.remove("show");
  else { banner.textContent = probe.error; banner.classList.add("show"); }

  const lag = d.lag_blocks;
  const lagText = lag == null ? "—"
    : lag <= 0 ? (lag < 0 ? "source is behind the node" : "in sync")
    : fmtInt(lag) + " block" + (lag === 1 ? "" : "s") + " behind";
  const lagCls = lag == null ? "" : lag <= 0 ? "ok" : "err";

  $("cards").innerHTML =
    card("Source", `<span class="${ok ? "ok" : "err"}">${d.kind === "unknown" ? "not detected" : d.kind}</span>`,
         ok ? (data.via || "") : "last probe failed", true) +
    card("Source tip", data.tip_height != null ? fmtInt(data.tip_height) : "—",
         ok && data.tip_height == null ? (data.note || "no tip reported") : "&nbsp;") +
    card("Node tip", node.available && node.tip_height != null ? fmtInt(node.tip_height) : "—",
         node.available ? "from the node's snapshot" : "node snapshot unavailable") +
    card("Lag", `<span class="${lagCls}">${lagText}</span>`, "", true) +
    card("On-chain wallet", node.available ? esc(ago(node.onchain_wallet_sync_timestamp)) : "—",
         "last full sync to the node") +
    card("Lightning sync", node.available ? esc(ago(node.lightning_wallet_sync_timestamp)) : "—",
         "lightning wallet data sync");

  const rows = [];
  const row = (k, v) => rows.push(`<div>${k}</div><div>${v || "—"}</div>`);
  row("Kind", esc(d.kind));
  row("Endpoint", d.endpoint ? idSpan(d.endpoint) : null);
  if (ok) {
    if (data.via) row("Probed via", esc(data.via));
    if (data.tip_hash) row("Source tip hash", idSpan(data.tip_hash));
    if (data.peers_connected != null)
      row("Filter peers", fmtInt(data.peers_connected) + ' connected · full stats on the <a href="/kyoto">Kyoto page</a>');
    if (data.note) row("Note", esc(data.note));
  }
  if (node.available) {
    if (node.tip_hash) row("Node tip hash", idSpan(node.tip_hash));
  } else if (node.error) {
    row("Node snapshot", esc(typeof node.error === "string" ? node.error : "unavailable"));
  }
  $("details").innerHTML = rows.join("");
}

async function refresh() {
  try {
    const r = await fetch("/api/chainsource");
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  } catch (e) {
    setConn(false, "dashboard error");
    $("cards").innerHTML = card("Error", `<span class="err">failed to load /api/chainsource</span>`, esc(String(e)), true);
    $("details").innerHTML = "";
  }
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
