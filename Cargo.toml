[package]
name = "ldk-server-gui"
version = "0.1.0"
edition = "2021"
publish = false
description = "Web dashboard and control panel for an LDK Server node"

[dependencies]
# The client crate of the ldk-server this dashboard talks to. The branch is what to follow; Cargo.lock
# pins the exact commit (`cargo update -p ldk-server-client` moves it). To pin a commit in this file
# instead, replace `branch = "..."` with `rev = "<commit>"`.
ldk-server-client = { git = "https://github.com/randomlogin/ldk-server", branch = "cbd-chain-source", features = ["serde"] }
axum = "0.8"
# Plain-HTTP client for kyoto's stats endpoint; same version ldk-server-client already uses.
reqwest = { version = "0.11", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = "1"
getrandom = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["sync"] }
